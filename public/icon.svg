<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1d45" />
      <stop offset="60%" stop-color="#132e66" />
      <stop offset="100%" stop-color="#07112b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="52%" r="44%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="head" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="72%" stop-color="#eef5fd" />
      <stop offset="100%" stop-color="#b8cce2" />
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <circle cx="256" cy="264" r="210" fill="url(#glow)" />
  <!-- Snowflake sparkles -->
  <circle cx="110" cy="130" r="6" fill="#bae6fd" opacity="0.7" />
  <circle cx="408" cy="148" r="8" fill="#e0f2fe" opacity="0.8" />
  <circle cx="132" cy="396" r="5" fill="#7dd3fc" opacity="0.65" />
  <circle cx="394" cy="384" r="6" fill="#bae6fd" opacity="0.7" />
  <!-- Snowball Head -->
  <ellipse cx="256" cy="316" rx="122" ry="108" fill="url(#head)" stroke="#09132a" stroke-width="12" />
  <!-- Rosy Cheeks -->
  <ellipse cx="184" cy="342" rx="22" ry="13" fill="#fb7185" opacity="0.55" />
  <ellipse cx="328" cy="342" rx="22" ry="13" fill="#fb7185" opacity="0.55" />
  <!-- Eyes -->
  <ellipse cx="216" cy="306" rx="19" ry="28" fill="#091124" />
  <ellipse cx="296" cy="306" rx="19" ry="28" fill="#091124" />
  <circle cx="223" cy="294" r="8" fill="#ffffff" />
  <circle cx="303" cy="294" r="8" fill="#ffffff" />
  <!-- Smile -->
  <path d="M 234 348 Q 256 368 278 348" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" />
  <!-- Blue Winter Cap -->
  <path d="M 136 244 Q 154 114 256 108 Q 160 88 120 148 Q 214 166 376 244 Z" fill="url(#hat)" stroke="#09132a" stroke-width="12" stroke-linejoin="round" />
  <!-- White Fluffy Brim -->
  <rect x="122" y="220" width="268" height="48" rx="24" fill="#ffffff" stroke="#09132a" stroke-width="12" />
  <!-- Pom-Pom -->
  <circle cx="118" cy="148" r="36" fill="#ffffff" stroke="#09132a" stroke-width="12" />
</svg>
